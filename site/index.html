<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="React + Tailwind 4 components you copy into your project and own."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="@davidalmeida/ui" />
    <meta property="og:title" content="@davidalmeida/ui — components you copy, read and own" />
    <meta
      property="og:description"
      content="React 19 + Tailwind 4 components written by hand, no Radix. The CLI copies the source into your project."
    />
    <meta property="og:url" content="https://davidalmeida-ui.vercel.app" />
    <meta property="og:image" content="https://davidalmeida-ui.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>@davidalmeida/ui</title>
    <script>
      try {
        const t = localStorage.getItem('theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
